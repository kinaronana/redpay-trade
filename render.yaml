services:
  - type: web
    name: redpay-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: redpay-site
    runtime: static
    staticPublishPath: ./frontend/public
